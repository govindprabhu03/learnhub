name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/cache@v4
        with: { path: data/models, key: embedding-model-bge-small-v1 }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tests/smoke.py
      - run: python tests/worker_process.py

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - uses: actions/cache@v4
        with: { path: data/models, key: embedding-model-bge-small-v1 }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tests/smoke.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "learnhub:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max" }
